<style>

</style></head><body>
<header>Notre hub<button id="undo" onclick="undo()">↶ Annuler</button></header><div id="m"></div>
<div id="login"><div class="card" style="width:min(340px,90%)"><h3 style="margin-top:0">Notre hub</h3><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"><div id="err" style="color:#c0392b;font-size:13px;min-height:18px"></div><button class="b1" style="width:100%" onclick="login()">Se connecter</button></div></div>
<nav><button data-t="home">🏠<br>Accueil</button><button data-t="agenda">📅<br>Agenda</button><button data-t="tasks">✅<br>Rappels</button><button data-t="budget">💶<br>Budget</button><button data-t="savings">🏦<br>Épargne</button></nav>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),dt=s=>new Date(s+'T00:00:00');

const W={g:'Guillaume',p:'Pauline',c:'Commun'},OW=[['g','Guillaume'],['p','Pauline'],['c','Commun']];

let db=null,tab='home',acct='c',calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=TODAY(),tm={};
function toast(t){const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)}

function save(k){S[k].prev=base[k];base[k]=JSON.stringify(strip(S[k]));render();persist(k)}
function undo(){const k=tab==='budget'?'budget':tab==='savings'?'savings':'agenda',p=S[k].prev;if(!p)return toast('Rien à annuler');const cur=strip(S[k]);S[k]=JSON.parse(p);S[k].prev=JSON.stringify(cur);base[k]=JSON.stringify(strip(S[k]));render();persist(k);toast('Dernière modification annulée (re-clique pour rétablir)')}
const FER={};function fer(y){if(FER[y])return FER[y];const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1,E=y+'-'+p2(mo)+'-'+p2(da),o={};
o[y+'-01-01']="Jour de l'an";o[add(E,1)]='Lundi de Pâques';o[y+'-05-01']='Fête du Travail';o[y+'-05-08']='Victoire 1945';o[add(E,39)]='Ascension';o[add(E,50)]='Lundi de Pentecôte';o[y+'-07-14']='Fête nationale';o[y+'-08-15']='Assomption';o[y+'-11-01']='Toussaint';o[y+'-11-11']='Armistice 1918';o[y+'-12-25']='Noël';return FER[y]=o}
const hol=s=>fer(+s.slice(0,4))[s],endOf=e=>e.e&&e.e>=e.d?e.e:e.d,onDay=(e,x)=>e.d<=x&&x<=endOf(e);
function nextTk(t){if(!t.d)return null;const T=TODAY();if(!t.r||t.r==='0'||t.d>=T)return t.d;if(t.r==='w')return add(t.d,7*Math.ceil(diffD(t.d,T)/7));
const n=t.r==='m'?1:12,k=Math.floor(((+T.slice(0,4)-+t.d.slice(0,4))*12+(+T.slice(5,7)-+t.d.slice(5,7)))/n);let r=addM(t.d,k*n);if(r<T)r=addM(t.d,(k+1)*n);return r}
function nextBd(b){const T=TODAY(),y=+T.slice(0,4);let r=y+b.d.slice(4);if(r<T)r=(y+1)+b.d.slice(4);return r}
const chip=w=>`<span class="chip" style="background:var(--${w})">${W[w]}</span>`;
function sheet(title,F,V,ok,del){const o=document.createElement('div');o.className='ov';
o.innerHTML=`<div class="sh"><h3>${esc(title)}</h3>${F.map(f=>`<label>${f.l}${f.t==='select'?`<select data-k="${f.k}">${f.o.map(([v,l])=>`<option value="${v}"${V[f.k]==v?' selected':''}>${l}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t}"${f.t==='number'?' step="0.01" inputmode="decimal"':''} value="${esc(V[f.k]??'')}">`}</label>`).join('')}<div class="bt"><button class="b0">Annuler</button>${del?'<button class="bd">Supprimer</button>':''}<button class="b1">Valider</button></div></div>`;
document.body.append(o);const cl=()=>o.remove();o.onclick=e=>{if(e.target===o)cl()};o.querySelector('.b0').onclick=cl;
if(del)o.querySelector('.bd').onclick=()=>{del();cl()};
o.querySelector('.b1').onclick=()=>{const r={};o.querySelectorAll('[data-k]').forEach(i=>r[i.dataset.k]=i.type==='number'?(i.value===''?0:+i.value):i.value);ok(r);cl()}}
function evForm(id,day){const e=S.agenda.ev.find(x=>x.id===id)||{w:'c',d:day||TODAY()};
sheet(id?'Modifier l’événement':'Nouvel événement',[{k:'t',l:'Événement',t:'text'},{k:'w',l:'Pour',t:'select',o:OW},{k:'d',l:'Date de début',t:'date'},{k:'s',l:'Heure de début (vide = toute la journée)',t:'time'},{k:'e',l:'Date de fin (si plusieurs jours)',t:'date'},{k:'f',l:'Heure de fin',t:'time'}],e,r=>{if(!r.t||!r.d)return;if(id)Object.assign(e,r);else S.agenda.ev.push({id:uid(),...r});save('agenda')},id&&(()=>{S.agenda.ev=S.agenda.ev.filter(x=>x.id!==id);save('agenda')}))}
function bdForm(id){const e=S.agenda.bd.find(x=>x.id===id)||{w:'c'};
sheet(id?'Modifier':'Nouvel anniversaire',[{k:'n',l:'Nom',t:'text'},{k:'w',l:'Dans la liste de',t:'select',o:OW},{k:'d',l:'Date de naissance (année inconnue : 1900)',t:'date'}],e,r=>{if(!r.n||!r.d)return;if(id)Object.assign(e,r);else S.agenda.bd.push({id:uid(),...r});save('agenda')},id&&(()=>{S.agenda.bd=S.agenda.bd.filter(x=>x.id!==id);save('agenda')}))}
function tkForm(id){const e=S.agenda.tk.find(x=>x.id===id)||{w:'c',r:'0',p:'n'};
sheet(id?'Modifier le rappel':'Nouveau rappel',[{k:'t',l:'Tâche',t:'text'},{k:'w',l:'Pour',t:'select',o:OW},{k:'d',l:'Échéance (première date)',t:'date'},{k:'r',l:'Répétition',t:'select',o:[['0','Une seule fois'],['w','Chaque semaine'],['m','Chaque mois'],['y','Chaque année']]},{k:'p',l:'Priorité',t:'select',o:[['h','Haute'],['n','Normale'],['b','Basse']]}],e,r=>{if(!r.t)return;if(id)Object.assign(e,r);else S.agenda.tk.push({id:uid(),...r});save('agenda')},id&&(()=>{S.agenda.tk=S.agenda.tk.filter(x=>x.id!==id);save('agenda')}))}
function lnForm(id,t){const e=S.budget.lines.find(x=>x.id===id)||{a:acct,t,pr:0,re:0};
sheet(id?'Modifier la ligne':'Nouvelle ligne',[{k:'n',l:'Catégorie',t:'text'},{k:'pr',l:'Prévu (€)',t:'number'},{k:'re',l:'Réel (€)',t:'number'}],e,r=>{if(!r.n)return;if(id)Object.assign(e,r);else S.budget.lines.push({id:uid(),a:acct,t:e.t,...r});save('budget')},id&&(()=>{S.budget.lines=S.budget.lines.filter(x=>x.id!==id);save('budget')}))}
function revForm(){sheet('Revenus nets mensuels',[{k:'g',l:'Guillaume (€)',t:'number'},{k:'p',l:'Pauline (€)',t:'number'}],S.budget.rev,r=>{S.budget.rev=r;save('budget')})}
function closeMonth(){sheet('Clôturer '+S.budget.mois+' ? Les « Réel » seront archivés puis remis à zéro.',[],{},()=>{const B=S.budget;B.hist.push({m:B.mois,c:dep('c','re'),g:dep('g','re'),p:dep('p','re'),e:sum(0,'epargne','re'),l:B.lines.filter(l=>l.t!=='epargne'&&l.re).map(l=>({a:l.a,n:l.n,v:+l.re}))});B.lines.forEach(l=>l.re=0);B.mois=addM(B.mois+'-01',1).slice(0,7);save('budget')})}
const evSort=(a,b)=>((a.d<TODAY()?TODAY():a.d)+(a.s||'')).localeCompare((b.d<TODAY()?TODAY():b.d)+(b.s||''));
const evRow=e=>`<div class="row ${e.w}" onclick="evForm('${e.id}')"><div class="t">${esc(e.t)}<br><small>${fd(e.d)}${e.e&&e.e>e.d?' → '+fd(e.e):''} · ${e.s?e.s+(e.f?' - '+e.f:''):'Toute la journée'}</small></div>${chip(e.w)}</div>`;
const bdRow=b=>{const n=nextBd(b),j=diffD(TODAY(),n),y=+b.d.slice(0,4);return `<div class="row ${b.w}" onclick="bdForm('${b.id}')"><div class="t">🎂 ${esc(b.n)}<br><small>${fd(n)}${y>1900?' · '+(+n.slice(0,4)-y)+' ans':''}</small></div><b>${j?'dans '+j+' j':'Aujourd’hui'}</b></div>`};
const RP={0:'',w:'Chaque semaine',m:'Chaque mois',y:'Chaque année'};
const tkRow=t=>{const n=nextTk(t),late=n&&n<TODAY();return `<div class="row ${t.w}" onclick="tkForm('${t.id}')"><div class="t">${esc(t.t)}<br><small>${n?(late?'<span class="late">'+fd(n)+'</span>':fd(n)):'Sans date'}${t.r&&t.r!=='0'?' · ↻ '+RP[t.r]:''} · ${{h:'Haute',n:'Normale',b:'Basse'}[t.p]}</small></div><button class="add" onclick="event.stopPropagation();doneTk('${t.id}')">✓</button></div>`};
function doneTk(id){const t=S.agenda.tk.find(x=>x.id===id);t.x=1;save('agenda')}
const upEv=()=>S.agenda.ev.filter(e=>endOf(e)>=TODAY()).sort(evSort),upBd=()=>[...S.agenda.bd].sort((a,b)=>nextBd(a).localeCompare(nextBd(b))),upTk=()=>S.agenda.tk.filter(t=>!t.x).sort((a,b)=>(nextTk(a)||'9').localeCompare(nextTk(b)||'9'));

<h2>Rappels</h2>${upTk().slice(0,6).map(tkRow).join('')||none('Aucun rappel')}<h2>Sauvegarde</h2><div class="seg"><button onclick="exportData()">Exporter</button><button onclick="importData()">Importer</button><button onclick="logout()">Déconnexion</button></div>`}
function agenda(){const first=new Date(calY,calM,1),start=add(iso(first),-((first.getDay()+6)%7));let h=`<div class="nav2"><button class="add" onclick="cm(-1)">‹</button>${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}<button class="add" onclick="cm(1)">›</button></div><div class="cal">`+['L','M','M','J','V','S','D'].map(x=>`<b>${x}</b>`).join('');
for(let i=0;i<42;i++){const x=add(start,i),ev=S.agenda.ev.filter(e=>onDay(e,x)),bd=S.agenda.bd.some(b=>b.d.slice(4)===x.slice(4));

function cm(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render()}
function tasks(){const done=S.agenda.tk.filter(t=>t.x);return `<h2>Rappels à faire<button class="add" onclick="tkForm()">+ Rappel</button></h2>${upTk().map(tkRow).join('')||none('Aucun rappel')}${done.length?`<h2>Terminés</h2>`+done.map(t=>`<div class="row ${t.w}" onclick="tkForm('${t.id}')"><div class="t"><s>${esc(t.t)}</s></div><button class="add" onclick="event.stopPropagation();S.agenda.tk.find(x=>x.id==='${t.id}').x=0;save('agenda')">↺</button></div>`).join(''):''}`}
const sum=(a,t,f)=>S.budget.lines.filter(l=>(!a||l.a===a)&&(!t||l.t===t)).reduce((s,l)=>s+(+l[f]||0),0),dep=(a,f)=>sum(a,'fixe',f)+sum(a,'var',f)+sum(a,'credit',f);

const TY=[['fixe','Dépenses fixes'],['var','Dépenses variables'],['credit','Prêts / crédits'],['epargne','Épargne']];
function budget(){const B=S.budget,mo=dt(B.mois+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
let h=`<div class="seg">${OW.slice().reverse().map(([k,l])=>`<button class="${acct===k?'on':''}" style="background:var(--${k})" onclick="acct='${k}';render()">${l}</button>`).join('')}</div><div class="mut" style="text-transform:capitalize">${mo}</div>`;
const pc=dep('c','pr');
if(acct==='c')h+=`<h2>Revenus et répartition<button class="add" onclick="revForm()">Modifier</button></h2><div class="card">${['g','p'].map(w=>`<div class="ln"><span>${W[w]} · ${eur(B.rev[w])}</span><span>${Math.round(shr(w)*100)} %</span><span>${eur(pc*shr(w))}</span></div>`).join('')}<div class="mut">Part de chacun = dépenses communes prévues (${eur(pc)}) × sa part de revenu</div></div>`;
else{const rv=+B.rev[acct]||0,part=pc*shr(acct);h+=`<div class="card"><div class="ln"><span>Revenu net</span><span>${eur(rv)}</span></div><div class="ln"><span>Part du compte commun</span><span>− ${eur(part)}</span></div><div class="ln tot"><span>Revenu disponible</span><span>${eur(rv-part)}</span></div><div class="ln"><span>Reste prévu / réel</span><span>${eur(rv-part-dep(acct,'pr')-sum(acct,'epargne','pr'))}</span><span>${eur(rv-part-dep(acct,'re')-sum(acct,'epargne','re'))}</span></div></div>`}
for(const [t,l] of TY){const L=B.lines.filter(x=>x.a===acct&&x.t===t);if(acct==='c'&&t==='epargne')continue;
h+=`<h2>${l}<button class="add" onclick="lnForm('','${t}')">+</button></h2><div class="card"><div class="ln mut"><span></span><span>Prévu</span><span>Réel</span><span>Écart</span></div>${L.map(x=>`<div class="ln" onclick="lnForm('${x.id}')"><span>${esc(x.n)}</span><span>${eur(x.pr)}</span><span>${eur(x.re)}</span><span>${eur(x.pr-x.re)}</span></div>`).join('')||none('Vide')}<div class="ln tot"><span>Total</span><span>${eur(sum(acct,t,'pr'))}</span><span>${eur(sum(acct,t,'re'))}</span><span>${eur(sum(acct,t,'pr')-sum(acct,t,'re'))}</span></div></div>`}
h+=`<button class="b1" style="width:100%;margin-top:12px" onclick="closeMonth()">Clôturer le mois</button><h2>Récap de l’année</h2>`+recap()+`<h2>Mois passés</h2>`+(B.hist.slice().reverse().map(x=>`<div class="card"><b>${x.m}</b><br><small class="mut">Dépenses réelles — Commun ${eur(x.c)} · Guillaume ${eur(x.g)} · Pauline ${eur(x.p)} · Épargne ${eur(x.e)}</small></div>`).join('')||none('Aucun mois archivé'));return h}
function recap(){const y=S.budget.mois.slice(0,4),H=S.budget.hist.filter(x=>x.m.slice(0,4)===y);if(!H.length)return none('Archive un mois pour voir le récap');
const T=x=>(+x.c||0)+(+x.g||0)+(+x.p||0),tot=H.reduce((s,x)=>s+T(x),0),mx=H.reduce((a,b)=>T(b)>T(a)?b:a),mn=H.reduce((a,b)=>T(b)<T(a)?b:a),by={};
H.forEach(x=>(x.l||[]).forEach(o=>{const k=o.a+'|'+o.n;by[k]=(by[k]||0)+o.v}));const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,10);
return `<div class="card"><div class="ln"><span>Mois archivés</span><span>${H.length}</span></div><div class="ln"><span>Total dépenses</span><span>${eur(tot)}</span></div><div class="ln"><span>Moyenne / mois</span><span>${eur(tot/H.length)}</span></div><div class="ln"><span>Plus dépensier</span><span>${mx.m}</span><span>${eur(T(mx))}</span></div><div class="ln"><span>Moins dépensier</span><span>${mn.m}</span><span>${eur(T(mn))}</span></div></div><div class="card"><b>Par compte (année)</b>${OW.map(([k,l])=>`<div class="ln"><span>${l}</span><span>${eur(H.reduce((s,x)=>s+(+x[k]||0),0))}</span></div>`).join('')}</div>`+(top.length?`<div class="card"><b>Top 10 des dépenses</b>${top.map(([k,v])=>{const [a,n]=k.split('|');return `<div class="ln"><span>${esc(n)} <small class="mut">${W[a]}</small></span><span>${eur(v)}</span></div>`}).join('')}</div>`:'')}
const bal=a=>(+a.s||0)+Object.values(S.savings.mv).reduce((s,m)=>s+(+m[a.id]||0),0);
function savings(){const A=S.savings.acc,tot=A.reduce((s,a)=>s+bal(a),0),M=Object.keys(S.savings.mv).sort().reverse();
return `<h2>Soldes<button class="add" onclick="accForm()">+ Compte</button></h2><div class="card">${A.map(a=>`<div class="ln" onclick="accForm('${a.id}')"><span>${esc(a.n)}</span><span>${tot?Math.round(bal(a)/tot*100):0} %</span><span>${eur(bal(a))}</span></div>`).join('')||none('Aucun compte')}<div class="ln tot"><span>Total épargne</span><span></span><span>${eur(tot)}</span></div></div><h2>Versements<button class="add" onclick="mvForm()">+ Mois</button></h2>${M.map(m=>{const t=Object.values(S.savings.mv[m]).reduce((s,x)=>s+(+x||0),0);return `<div class="row" onclick="mvForm('${m}')"><div class="t">${dt(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div><b>${eur(t)}</b></div>`}).join('')||none('Aucun versement')}`}
function accForm(id){const e=S.savings.acc.find(x=>x.id===id)||{s:0};sheet(id?'Modifier le compte':'Nouveau compte',[{k:'n',l:'Nom',t:'text'},{k:'s',l:'Solde de départ (€)',t:'number'}],e,r=>{if(!r.n)return;if(id)Object.assign(e,r);else S.savings.acc.push({id:uid(),...r});save('savings')},id&&(()=>{S.savings.acc=S.savings.acc.filter(x=>x.id!==id);save('savings')}))}
function mvForm(m){const mo=m||TODAY().slice(0,7);sheet('Versements de '+mo,S.savings.acc.map(a=>({k:a.id,l:a.n+' (€ ajoutés)',t:'number'})),S.savings.mv[mo]||{},r=>{S.savings.mv[mo]=r;save('savings')})}

function render(){$('#m').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();$('#m').scrollTop=0});

firebase.initializeApp(cfg);const auth=firebase.auth(),fs=firebase.firestore();let unsub=[];
function login(){const e=$('#em').value.trim(),p=$('#pw').value;$('#err').textContent='';auth.signInWithEmailAndPassword(e,p).catch(()=>$('#err').textContent='E-mail ou mot de passe incorrect')}
