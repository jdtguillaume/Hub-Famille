body{font:15px/1.4 -apple-system,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;color:var(--tx);background:radial-gradient(75% 45% at 8% -6%,var(--glow),transparent 72%),radial-gradient(55% 38% at 108% 14%,var(--g2),transparent 70%),radial-gradient(60% 40% at 50% 112%,var(--g3),transparent 70%),var(--bg);background-attachment:fixed}

e="margin-top:6px">Actuellement : <b>${SEAS[seasonNow()]}</b>. Automatique : Halloween tout le mois d’octobre, Noël tout le mois de décembre, Normal le reste de l’année. Ce choix est propre à cet appareil.</div></div><h2>Apparence</h2><div class="card"><div class="seg sub" style="margin-bottom:0">${[['auto','Automatique'],['light','Clair'],['dark','Sombre']].map(([k,l])=>`<button class="${themeNow()===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><div class="mut" style="margin-top:6px">Automatique suit le réglage de ton téléphone. Ce choix est propre à cet appareil.</div></div><h2>Compte</h2><div class="card"><div class="ln"><span>Connecté en tant que</span><span style="width:auto">${esc(me)}</span></div><div class="ln"><span>Version de l’app</span><span style="width:auto">${APP_V}</span></div></div>`}
