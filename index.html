body{font:15px/1.4 -apple-system,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;color:var(--tx);background:radial-gradient(75% 45% at 8% -6%,var(--glow),transparent 72%),radial-gradient(55% 38% at 108% 14%,var(--g2),transparent 70%),radial-gradient(60% 40% at 50% 112%,var(--g3),transparent 70%),var(--bg);background-attachment:fixed}

BXS='';if(tot.skip&&!BXE)BXE=tot.skip+' opération'+(tot.skip>1?'s':'')+' déjà importée'+(tot.skip>1?'s':'')+' ignorée'+(tot.skip>1?'s':'')+'.';bxRender()}
function bxPasteGo(){const t=(document.getElementById('bxtxt')||{}).value||'';const rows=bxParse(bxTextLines(t),TODAY()),r=bxAdd(rows);BXMODE='';BXE=rows.length?(r.skip?r.skip+' déjà importée'+(r.skip>1?'s':'')+' ignorée'+(r.skip>1?'s':'')+'.':''):'Aucune opération reconnue dans ce texte.';bxRender()}
const bxOpts=sel=>{const me2=myK(),o=l=>l.a===me2?0:l.a==='c'?1:2;return'<option value="">— Choisir une catégorie —</option>'+S.budget.lines.slice().sort((a,b)=>o(a)-o(b)).map(l=>`<option value="${l.id}"${l.id===sel?' selected':''}>${W[l.a]} · ${esc(l.n)}</option>`).join('')};
function bxCard(r){const B=S.budget,sel=r.l||bxSug(r.label),fz=r.cr!=='CRDT'&&bxFuzzy(r),pm=r.d.slice(0,7)!==B.mois;
if(r.cr==='CRDT')return`<div class="bxc cr" data-bx="${r.id}"><div class="bxt"><div><b>${esc(r.label)}</b><small>${fd(r.d)}${r.h?' · '+r.h:''} · entrée d’argent</small></div><b class="bxv in">+ ${eur(r.v)}</b></div><div class="bxb"><button class="b0" onclick="bxFlip('${r.id}')">C’est une dépense</button><button class="b1" onclick="bxSkip('${r.id}',1)">Ignorer</button></div></div>`;
return`<div class="bxc" data-bx="${r.id}"><div class="bxt"><div><b>${esc(r.label)}</b><small>${fd(r.d)}${r.h?' · '+r.h:''}${r.sub?' · '+esc(r.sub):''}</small></div><b class="bxv">${eur(r.v)}</b></div>${r.dflag?'<div class="bxf">Date non lue : aujourd’hui supposé, vérifie-la dans « Modifier ».</div>':''}${fz?'<div class="bxf">Peut-être déjà saisie (même montant, date proche). <button class="add" onclick="bxSame(\''+r.id+'\')">Déjà saisie</button></div>':''}
<select class="bxs" onchange="bxSetL('${r.id}',this.value)">${bxOpts(sel)}</select>${pm?`<label class="bxp">Période du budget<select class="bxpp"><option value="${B.mois}">${mlab(B.mois)}</option><option value="${r.d.slice(0,7)}">${mlab(r.d.slice(0,7))}</option></select></label>`:''}
<details class="bxed"><summary>Modifier</summary><label>Libellé<input class="bxl" value="${esc(r.label)}"></label><div class="bxg"><label>Date<input type="date" class="bxdt" value="${r.d}"></label><label>Heure<input type="time" class="bxh" value="${r.h||''}"></label><label>Montant<input class="bxa" inputmode="decimal" value="${String(r.v).replace('.',',')}"></label></div><button class="add" onclick="bxFlip('${r.id}')">C’est une entrée d’argent</button></details>
<label class="bxr"><input type="checkbox" class="bxru" ${r.ru?'checked':''}> Retenir la catégorie pour la prochaine fois</label><div class="bxb"><button class="b0" onclick="bxSkip('${r.id}')">Ignorer</button><button class="b1" onclick="bxOk('${r.id}')">Valider</button></div></div>`}
function bxRender(){const ov=document.getElementById('bxov');if(!ov)return;const top=(ov.querySelector('.rpb')||{}).scrollTop||0,N=BXP.length,D=BXP.filter(r=>r.cr!=='CRDT').length;
ov.innerHTML=`<div class="rph"><b>Importer depuis une capture</b><button class="rpx" aria-label="Fermer" onclick="bxClose()">✕</button></div><div class="rpb"><div class="card bxpv"><b>Ta capture reste sur ton téléphone.</b><div class="mut">Elle est lue ici même : elle n’est envoyée à aucun serveur et elle est effacée de la mémoire de l’app dès que tu fermes cet écran. Seule la transaction que tu valides est enregistrée (date, heure, libellé, montant, catégorie). Pense à supprimer la capture de ta galerie.</div></div>
<div class="card"><div class="bxb"><button class="b1" onclick="document.getElementById('bxfile').click()">📷 Choisir une capture</button><button class="b0" onclick="BXMODE=BXMODE==='paste'?'':'paste';bxRender()">Coller du texte</button></div><input type="file" id="bxfile" accept="image/*" multiple hidden onchange="bxFiles(this)">${BXS?`<div class="mut" id="bxst" style="margin-top:8px">${esc(BXS)}</div>`:''}${BXMODE==='paste'?`<textarea id="bxtxt" class="bxta" placeholder="Colle ici le texte copié depuis ta banque (une opération par ligne : libellé puis montant)"></textarea><button class="b1" style="width:100%" onclick="bxPasteGo()">Analyser le texte</button>`:''}${BXE?`<div class="bxerr">${esc(BXE)}</div>`:''}${BXG.length?`<div class="mut" style="margin-top:10px;font-size:12px">${BXG.length} ligne${BXG.length>1?'s':''} ignorée${BXG.length>1?'s':''} ne reviendr${BXG.length>1?'ont':'a'} pas. <a href="#" onclick="bxForget();return false">Les oublier</a></div>`:''}${BXI.length?`<details class="bxim"><summary>Voir la capture (en mémoire, effacée à la fermeture)</summary>${BXI.map(u=>`<img src="${u}" alt="capture">`).join('')}</details>`:''}</div>
${N?`<div class="bxcount"><b>${D} à valider</b>${N>D?`<span class="mut"> · ${N-D} entrée${N-D>1?'s':''} d’argent</span>`:''}<button class="add" onclick="bxClear()">Tout effacer</button></div>`:(BXS?'':`<div class="mut" style="margin:10px 2px">Rien à valider pour l’instant. Les lignes reconnues apparaîtront ici ; tu choisis la catégorie et tu valides chacune.</div>`)}
${BXP.map(bxCard).join('')}</div>`;const nb=ov.querySelector('.rpb');if(nb)nb.scrollTop=top}
function bxSetL(id,v){const r=BXP.find(x=>x.id===id);if(r){r.l=v;bxPersist()}}
function bxFlip(id){const r=BXP.find(x=>x.id===id);if(!r)return;r.cr=r.cr==='CRDT'?'DBIT':'CRDT';bxPersist();bxRender()}
function bxSkip(id,now){const r=BXP.find(x=>x.id===id);if(!r)return;const go=()=>{BXG.push(r.sg);BXP=BXP.filter(x=>x.id!==id);bxPersist();bxRender()};if(now)go();else askYes('Ignorer « '+esc(r.label)+' » ? Elle n’ira pas dans tes transactions.',go,'Ignorer')}
function bxForget(){askYes('Oublier les '+BXG.length+' ligne'+(BXG.length>1?'s':'')+' ignorée'+(BXG.length>1?'s':'')+' ? Elles pourront être reproposées lors d’une prochaine capture.',()=>{BXG=[];bxPersist();bxRender()},'Oublier')}
function bxClear(){askYes('Effacer les '+BXP.length+' ligne'+(BXP.length>1?'s':'')+' en attente ? Rien n’est enregistré dans tes transactions.',()=>{BXP=[];bxPersist();bxRender()},'Tout effacer')}
function bxSame(id){const r=BXP.find(x=>x.id===id),t=r&&bxFuzzy(r);if(!t)return;t.sg=r.sg;save('trx');BXP=BXP.filter(x=>x.id!==id);bxPersist();bxRender();toast('Associée à ta transaction existante')}
function bxOk(id){const c=document.querySelector('[data-bx="'+id+'"]'),r=BXP.find(x=>x.id===id);if(!c||!r)return;const g=q=>c.querySelector(q),lab=g('.bxl').value.trim(),v=parseFloat(String(g('.bxa').value).replace(/\s/g,'').replace(',','.')),d=g('.bxdt').value,h=g('.bxh').value,l=g('.bxs').value,p=(g('.bxpp')||{}).value||S.budget.mois,ru=g('.bxru').checked;
if(!d||!(v>0))return toast('Vérifie la date et le montant');if(!l)return toast('Choisis une catégorie');const ln=LN(l);if(!ln)return toast('Catégorie introuvable');
const t={id:uid(),d,l,v:Math.round(v*100)/100,n:lab,p,ca:ln.a||'',cn:ln.n||'',ct:ln.t||'',cs:ln.t==='epargne'?(svOf(ln)||''):'',sg:r.sg};if(h)t.h=h;S.trx.tx.push(t);
if(ru){const k=bxKey(lab);if(k){S.trx.rules=bxRules().filter(q=>q.k!==k);S.trx.rules.push({k,l})}}
BXP=BXP.filter(x=>x.id!==id);bxPersist();save('trx');
if(!BXP.length){bxImgClear();BXS='';BXE='';if(new Date().getHours()>=17)try{localStorage.setItem('txDone',TODAY())}catch(e){}toast('Tout est validé : capture effacée de la mémoire')}bxRender()}
function exportData(){sheet('Copie tout ce texte (sauvegarde)',[{k:'j',l:'Données',t:'text'}],{j:JSON.stringify({budget:strip(S.budget),agenda:strip(S.agenda),savings:strip(S.savings),trx:strip(S.trx)})},()=>{})}
function importData(){sheet('Importer des données',[{k:'j',l:'Colle ici le texte de sauvegarde',t:'text'}],{},r=>doImport(r.j))}
function doImport(t){try{const d=JSON.parse(String(t).trim());deepFix(d);let n=0;['budget','agenda','savings','trx'].forEach(k=>{if(d[k]){S[k]=d[k];save(k);n++}});toast(n?'Données importées':'Rien à importer')}catch(e){toast('Texte invalide : '+e.message)}}
function importFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);i.value=''}
let tx0=0,ty0=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tab!=='org'||sub.org!=='cal'||!e.target.closest||!e.target.closest('.cal,.nav2,.dayv,.weekv'))return;const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))calStep(dx<0?1:-1)},{passive:true});
applySeason();
refreshBell();
</script></body></html>
