<script>

const FER={};function fer(y){if(FER[y])return FER[y];const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1,E=y+'-'+p2(mo)+'-'+p2(da),o={};
o[y+'-01-01']="Jour de l'an";o[add(E,1)]='Lundi de Pâques';o[y+'-05-01']='Fête du Travail';o[y+'-05-08']='Victoire 1945';o[add(E,39)]='Ascension';o[add(E,50)]='Lundi de Pentecôte';o[y+'-07-14']='Fête nationale';o[y+'-08-15']='Assomption';o[y+'-11-01']='Toussaint';o[y+'-11-11']='Armistice 1918';o[y+'-12-25']='Noël';return FER[y]=o}

o.innerHTML=`<div class="sh"><h3>${esc(title)}</h3>${F.map(f=>`<label>${f.l}${f.t==='select'?`<select data-k="${f.k}">${f.o.map(([v,l])=>`<option value="${v}"${V[f.k]==v?' selected':''}>${l}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t}"${f.t==='number'?' step="0.01" inputmode="decimal"':''} value="${esc(V[f.k]??'')}">`}</label>`).join('')}<div class="bt"><button class="b0">Annuler</button>${del?'<button class="bd">Supprimer</button>':''}<button class="b1">Valider</button></div></div>`;
